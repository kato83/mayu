# Default Kiro workflow - handles all four trigger modes with agent routing.
#
# Activates when:
#   - someone comments "/kiro <instruction>" on an issue or PR
#   - an issue or PR is labeled with "kiro"
#   - an issue or PR is assigned to the user "kirocli" (requires that user
#     to be a collaborator - most teams use the label trigger instead)
#
# Agent routing:
#   - "/kiro @<agent-name> <instruction>" routes to a specific agent
#     (e.g., /kiro @architect design the new API)
#   - "/kiro <instruction>" without @agent uses the default Kiro behavior
#
# Available agents: product-strategist, researcher, planner, architect,
# developer, reviewer, qa, devops, triage, marketer, devils-advocate

name: Kiro

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled, assigned]
  pull_request:
    types: [labeled, assigned]

jobs:
  kiro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prevent re-triggering from bot comments and limit to /kiro commands for comment events
    if: |
      github.actor != 'kiro-agent[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/kiro')) &&
      (github.event_name != 'pull_request_review_comment' || startsWith(github.event.comment.body, '/kiro'))
    concurrency:
      group: kiro-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity for Kiro
        run: |
          git config user.name "kiro-agent[bot]"
          git config user.email "244629292+kiro-agent[bot]@users.noreply.github.com"

      - name: Parse agent routing from comment
        id: parse-agent
        if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Use only the first line for routing to handle multiline comments safely.
          # The full comment body is passed as the prompt via the env variable.
          FIRST_LINE=$(echo "$COMMENT_BODY" | head -n 1)

          # Match pattern: /kiro @agent-name <rest of instruction>
          if echo "$FIRST_LINE" | grep -qP '^/kiro\s+@([\w-]+)'; then
            AGENT_NAME=$(echo "$FIRST_LINE" | grep -oP '^/kiro\s+@\K[\w-]+')
            INSTRUCTION=$(echo "$COMMENT_BODY" | sed -E '1s|^/kiro\s+@[\w-]+\s*||')

            # Validate agent name against the known list
            VALID_AGENTS="product-strategist researcher planner architect developer reviewer qa devops triage marketer devils-advocate"
            if ! echo "$VALID_AGENTS" | grep -qw "$AGENT_NAME"; then
              echo "::error::Unknown agent: $AGENT_NAME. Valid agents: $VALID_AGENTS"
              exit 1
            fi

            echo "agent=$AGENT_NAME" >> "$GITHUB_OUTPUT"
            echo "instruction<<EOF" >> "$GITHUB_OUTPUT"
            echo "$INSTRUCTION" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "routed=true" >> "$GITHUB_OUTPUT"
          else
            INSTRUCTION=$(echo "$COMMENT_BODY" | sed -E '1s|^/kiro\s*||')
            echo "agent=" >> "$GITHUB_OUTPUT"
            echo "instruction<<EOF" >> "$GITHUB_OUTPUT"
            echo "$INSTRUCTION" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "routed=false" >> "$GITHUB_OUTPUT"
          fi

      # Routed agent invocation (when @agent-name is specified)
      - name: Run with routed agent
        if: steps.parse-agent.outputs.routed == 'true'
        uses: kirodotdev-labs/kiro-action@v0
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
          kiro_args: '--agent ${{ steps.parse-agent.outputs.agent }}'
          prompt: ${{ steps.parse-agent.outputs.instruction }}

      # Default invocation (no agent routing, or non-comment triggers).
      # For label/assign events the parse-agent step is skipped entirely, so
      # outputs.routed is empty (not 'true'). In that case kiro-action runs
      # without an explicit prompt, which makes it operate on the issue/PR
      # context provided by the event payload.
      - name: Run with default agent
        if: steps.parse-agent.outputs.routed != 'true'
        uses: kirodotdev-labs/kiro-action@v0
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}