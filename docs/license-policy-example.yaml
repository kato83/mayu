# Example license policy for mayu audit --license-policy
# See docs/license-policy-example.md for detailed documentation.

license_policy:
  # Licenses explicitly allowed — no violation reported
  allow:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - Unlicense
    - CC0-1.0
    - 0BSD
    - Zlib
    - BSL-1.0
    - MIT-0
    - BlueOak-1.0.0
    - CC-BY-4.0
    - CC-BY-3.0
    - Unicode-3.0
    - PSF-2.0
    - WTFPL
    - X11

  # Licenses explicitly denied — causes exit code 1
  deny:
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - GPL-3.0-or-later
    - AGPL-3.0-only
    - AGPL-3.0-or-later
    - SSPL-1.0
    - OSL-3.0

  # Licenses requiring manual review — reported as warning
  review:
    - MPL-2.0
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
    - LGPL-3.0-or-later
    - EPL-1.0
    - EPL-2.0
    - CDDL-1.0
    - CDDL-1.1
    - EUPL-1.2
    - CC-BY-SA-4.0
