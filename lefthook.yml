pre-commit:
  commands:
    fmt:
      glob: "*.go"
      run: go fmt ./... && git diff --exit-code
      fail_text: "go fmt produced changes. Please stage the formatted files and retry."
    lint:
      glob: "*.go"
      run: make lint
    ui-check:
      glob: "ui/src/**/*.{ts,css,json}"
      root: "ui/"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      fail_text: "Biome check failed. Run 'cd ui && pnpm run check:fix' to fix."
